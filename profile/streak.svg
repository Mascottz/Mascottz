<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img" aria-labelledby="streakTitle streakDesc">
  <title id="streakTitle">Contribution streak</title>
  <desc id="streakDesc">1,875 contributions. Current streak 15 days. Longest streak 18 days.</desc>
  <style>
    .label { font: 400 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #ECE7DB }
    .date  { font: 400 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif; fill: #9FB6A7 }
  </style>

  <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#0D1A15" stroke="#24382E"/>

  <line x1="165" y1="28" x2="165" y2="170" stroke="#24382E" stroke-width="1"/>
  <line x1="330" y1="28" x2="330" y2="170" stroke="#24382E" stroke-width="1"/>

  <!-- total contributions -->
    <g transform="translate(82.5, 48)">
      <text x="0" y="32" text-anchor="middle" fill="#9FB6A7" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="700" font-size="28px">1,875</text>
    </g>
    <g transform="translate(82.5, 84)">
      <text x="0" y="32" text-anchor="middle" fill="#ECE7DB" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="400" font-size="14px">Total Contributions</text>
    </g>
    <g transform="translate(82.5, 114)">
      <text x="0" y="32" text-anchor="middle" fill="#9FB6A7" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="400" font-size="12px">2024 Jul 11 - Present</text>
    </g>

  <!-- current streak: number inside the ring, then label, then range -->
  <circle cx="247.5" cy="71" r="40" fill="none" stroke="#C98E5F" stroke-width="5"/>
    <g transform="translate(247.5, 48)">
      <text x="0" y="32" text-anchor="middle" fill="#E2794F" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="700" font-size="28px">15</text>
    </g>
    <g transform="translate(247.5, 108)">
      <text x="0" y="32" text-anchor="middle" fill="#ECE7DB" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="400" font-size="14px">Current Streak</text>
    </g>
    <g transform="translate(247.5, 145)">
      <text x="0" y="32" text-anchor="middle" fill="#9FB6A7" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="400" font-size="12px">Nov 3 - Nov 17</text>
    </g>

  <!-- longest streak -->
    <g transform="translate(412.5, 48)">
      <text x="0" y="32" text-anchor="middle" fill="#9FB6A7" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="700" font-size="28px">18</text>
    </g>
    <g transform="translate(412.5, 84)">
      <text x="0" y="32" text-anchor="middle" fill="#ECE7DB" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="400" font-size="14px">Longest Streak</text>
    </g>
    <g transform="translate(412.5, 114)">
      <text x="0" y="32" text-anchor="middle" fill="#9FB6A7" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', sans-serif" font-weight="400" font-size="12px">Sep 23 - Oct 10</text>
    </g>
</svg>
